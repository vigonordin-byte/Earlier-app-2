name: Earlier
options:
  bundleIdPrefix: com.earlier
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    GENERATE_INFOPLIST_FILE: "NO"
    ALWAYS_SEARCH_USER_PATHS: "NO"
targets:
  Earlier:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Earlier
        CFBundleShortVersionString: "1.0.0"
        NSAlarmKitUsageDescription: Earlier schedules your wake-up alarms so they ring reliably, even in silent mode or Focus.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIAppFonts:
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
          - PlusJakartaSans-ExtraBold.ttf
    settings:
      base:
        PRODUCT_NAME: Earlier
        PRODUCT_BUNDLE_IDENTIFIER: com.earlier.app
        SWIFT_VERSION: "5.0"
